name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Android-App bauen
        run: flutter build apk --release

      - name: Web-App bauen
        run: flutter build web --release

      - name: Android-App zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bubududu-android
          path: build/app/outputs/flutter-apk/app-release.apk

      # Veröffentlicht die Web-App, sobald das Secret FIREBASE_SERVICE_ACCOUNT angelegt ist (siehe README).
      - name: Web-App veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bubududu-15f3f
