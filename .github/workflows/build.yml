name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Prüft die Firestore-Regeln im Emulator (siehe test_rules/).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test_rules/package-lock.json
      - run: npm ci
        working-directory: test_rules
      - run: npm test
        working-directory: test_rules
      # Texte der Push-Nachrichten (functions/)
      - run: npm ci && npm test
        working-directory: functions

  build:
    needs: rules
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Android-App bauen
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk bubududu.apk

      - name: Web-App bauen
        run: flutter build web --release

      - name: Android-App zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bubududu-android
          path: bubududu.apk

      # Fester Link fürs Handy: https://github.com/TEE800/bubududu/releases/latest/download/bubududu.apk
      - name: Android-App als Download veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bubu & Dudu (Build ${{ github.run_number }})
          body: Android-App zum Installieren. Auf dem Handy bubududu.apk antippen.
          files: bubududu.apk
          make_latest: true

      # Veröffentlicht die Web-App erst, wenn die Repo-Variable PUBLISH_WEB auf true steht
      # (Settings → Secrets and variables → Actions → Variables) und das Secret existiert.
      - name: Web-App veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != '' && vars.PUBLISH_WEB == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bubududu-15f3f

  # Firestore-Regeln und Push-Funktion nach Firebase, sobald das Secret
  # FIREBASE_SERVICE_ACCOUNT angelegt ist (siehe README). Push braucht den Blaze-Tarif.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: '22'
      - name: Regeln und Funktionen veröffentlichen
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          (cd functions && npm ci)
          npx --yes firebase-tools@14 deploy --only firestore:rules,functions \
            --project bubududu-15f3f --non-interactive --force
